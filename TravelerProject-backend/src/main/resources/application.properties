spring.application.name=TravelerProject

# ============================
# 서버 설정
# ============================
server.port=8080

# ============================
# 프로필 설정 (민감 정보 분리)
# ============================
spring.profiles.include=secret

# ============================
# Oracle DB 연결 설정 (민감 정보는 application-secret.properties에)
# ============================
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ============================
# MyBatis 설정
# ============================
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.traveler.app.dto
mybatis.configuration.map-underscore-to-camel-case=true

# ============================
# 로깅 설정 (개발용)
# ============================
logging.level.com.traveler.app=DEBUG
logging.level.org.mybatis=DEBUG

# ============================
# TourAPI 설정 (서비스 키는 application-secret.properties에)
# ============================
tourapi.base-url=http://apis.data.go.kr/B551011/KorService2
tourapi.mobile-os=ETC
tourapi.mobile-app=TravelerProject